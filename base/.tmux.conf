# ============================================================================
# Tmux Configuration File
# Location: ~/.dotfiles/base/.tmux.conf
#
# Setup Instructions:
# Setup script:    ~/.dotfiles/setup/scripts/mac/tmux-setup.sh
#
# 1. Symlink to home directory:
#    ln -sf ~/.dotfiles/base/.tmux.conf ~/.tmux.conf
#
# 2. First-time TPM setup (one-time):
#    git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#
# 3. Install plugins after loading config:
#    Press: prefix + I (capital i)
#
# Reload config after changes:
#    Press: prefix + r
# ============================================================================

# Change prefix to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Enable mouse support
set -g mouse on

# Stay in copy mode after mouse selection (don't jump to bottom)
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection

# Set default terminal to support 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"

# Start window and pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback buffer to 10000 lines
set -g history-limit 10000

# ============================================================================
# Keybindings
# ============================================================================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split windows with | and - (more intuitive than % and ")
bind | split-window -h
bind - split-window -v
unbind %
unbind '"'

# Navigate between panes with arrow keys
bind -n C-Left select-pane -L
bind -n C-Right select-pane -R
bind -n C-Up select-pane -U
bind -n C-Down select-pane -D

# Ctrl+R to refresh display (no prefix needed)
bind -n C-r refresh-client \; display "Refreshed!"

# ============================================================================
# Visual & Status Bar
# ============================================================================

# Set status bar position (top)
set -g status-position top

# Mode badge styles (stored as variables to avoid comma conflicts in conditionals)
set -g @mode-prefix "#[bg=colour221,fg=black,bold] ⌨ PREFIX #[default]"
set -g @mode-copy "#[bg=colour75,fg=black,bold] 📋 COPY #[default]"
set -g @mode-normal "#[bg=colour240,fg=colour252,bold] NORMAL #[default]"

# Status bar styling - minimal and clean
set -g status-bg "#262626"
set -g status-fg white
set -g status-left "#{?client_prefix,#{E:#{@mode-prefix}},#{?pane_in_mode,#{E:#{@mode-copy}},#{E:#{@mode-normal}}}} #[bg=#{@session-bg},fg=#{@session-fg},bold] #S #[default] "
set -g status-left-length 60
set -g status-right "#[fg=dim]#(whoami)@#H #[fg=white]%Y-%m-%d #[fg=cyan,bold]%H:%M"
set -g status-right-length 50
set -g status-justify left

# Window list styling
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=white,fg=black] #I #W #[default]"

# Command prompt styling (prefix + :)
set -g message-style "fg=white,bold,bg=#2c2c2c"
set -g message-command-style "fg=white,bold,bg=#2c2c2c"

# Pane border colors
set -g pane-border-style fg=black
set -g pane-active-border-style fg=white

# Fix for escape sequence garbage (6c) appearing on attach/new session
# Sends Ctrl+U to clear the line after attach/session creation
set-hook -g client-attached 'run-shell -b "P=$(tmux display -p -t \"#{hook_client}\" \"#{pane_id}\"); tmux send-keys -t \"$P\" C-u"'
set-hook -g after-new-session 'run-shell -b "P=$(tmux display -p -t \"#{hook_client}\" \"#{pane_id}\"); tmux send-keys -t \"$P\" C-u"'

# Session color hooks - update badge color on session events
set-hook -g session-created 'run-shell -b "~/.dotfiles/base/scripts/tmux-session-color"'
set-hook -g client-session-changed 'run-shell -b "~/.dotfiles/base/scripts/tmux-session-color"'
set-hook -g session-renamed 'run-shell -b "~/.dotfiles/base/scripts/tmux-session-color"'
run-shell -b "~/.dotfiles/base/scripts/tmux-session-color"

# ============================================================================
# TPM (Tmux Plugin Manager)
# ============================================================================

# Set plugins directory
set -g @plugin-path ~/.tmux/plugins

# List plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ============================================================================
# Resurrect & Continuum Configuration
# ============================================================================

# Enable auto-restore on tmux start
set -g @continuum-restore 'on'

# Save interval in minutes (15 minutes)
set -g @continuum-save-interval '15'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# ============================================================================
# Initialize TPM (must be at the end of the config file)
# ============================================================================

# Fix black screen on focus return
set -g focus-events on
set-hook -g client-focus-in "refresh-client"

# Run TPM plugin manager
# Better mouse scrolling
set -g @plugin 'nhdaly/tmux-better-mouse-mode'
set -g @scroll-speed-num-lines-per-scroll 1

run '~/.tmux/plugins/tpm/tpm'
